name: Migration guard

# Blocks a PR whose new or changed EF Core migrations drop or rewrite existing data in Up(),
# until someone adds the db-destructive-approved label. See .github/scripts/check-destructive-migrations.sh.
on:
  pull_request:
    branches: [master]
    # labeled/unlabeled re-run the check when the approval label is added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# A newer run for the same PR cancels the older one. Any other label cannot change the result, yet a PR opened with
# one gets "opened" and "labeled" at the same moment: in one group, one run cancelled the other and could leave a
# cancelled check on the PR (#108). Concurrency is applied before the job's if, so such a run gets a group of its own,
# and its job is skipped.
concurrency:
  group: migration-guard-${{ github.event.pull_request.number }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'db-destructive-approved' && format('-label-{0}', github.event.label.name) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migration-guard:
    name: Migration guard
    # Not again for a label other than the approval label: it cannot change the result.
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || github.event.label.name == 'db-destructive-approved'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check migrations for data-destroying operations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'db-destructive-approved') }}
        run: .github/scripts/check-destructive-migrations.sh "$BASE_SHA"
