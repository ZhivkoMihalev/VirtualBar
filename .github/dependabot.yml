version: 2

# Monthly version updates. Minor and patch bumps are grouped into one PR per ecosystem;
# major bumps arrive as separate PRs because they usually need code changes.
# Security updates are not tied to this schedule — they open as soon as a vulnerability is published
# (enable "Dependabot security updates" in the repository settings).
updates:
  - package-ecosystem: npm
    directory: /VirtualBar.Web
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
