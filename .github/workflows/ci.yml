name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# A newer push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # the coverage comment
    env:
      # Throwaway database server for the HTTP tests; it exists only for this job, so not a secret.
      DB_PASSWORD: CiOnly-Passw0rd
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    # SQL Server for VirtualBar.HttpTests, which start the whole API on it. The unit tests do not use it.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: CiOnly-Passw0rd # services cannot read env; keep in sync with DB_PASSWORD
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Both test projects reference every other project, so building them builds the whole backend.
      - name: Restore
        run: |
          dotnet restore VirtualBar.Tests/VirtualBar.Tests.csproj
          dotnet restore VirtualBar.HttpTests/VirtualBar.HttpTests.csproj

      - name: Build
        id: build
        run: |
          dotnet build VirtualBar.Tests/VirtualBar.Tests.csproj --no-restore --configuration Release
          dotnet build VirtualBar.HttpTests/VirtualBar.HttpTests.csproj --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test VirtualBar.Tests/VirtualBar.Tests.csproj
          --no-build --configuration Release
          --logger trx
          --collect:"XPlat Code Coverage"
          --results-directory ./test-results

      # The HTTP tests also run when the unit tests failed, so one push shows every failure.
      - name: Wait for SQL Server
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          CONTAINER: ${{ job.services.sqlserver.id }}
        run: |
          for attempt in $(seq 1 30); do
            for sqlcmd in /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd; do
              if docker exec "$CONTAINER" "$sqlcmd" -C -S localhost -U sa -P "$DB_PASSWORD" -Q "SELECT 1" -b -o /dev/null 2>/dev/null; then
                echo "SQL Server is ready (attempt $attempt)."
                exit 0
              fi
            done
            sleep 3
          done
          echo "SQL Server did not become ready."
          docker logs "$CONTAINER" | tail -n 50
          exit 1

      # Writes its coverage next to the unit tests', so the report below merges both. GitHub sets CI=true,
      # under which a test that cannot reach SQL Server fails instead of skipping.
      - name: HTTP tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          VIRTUALBAR_TEST_SQL: Server=localhost,1433;User Id=sa;Password=${{ env.DB_PASSWORD }};TrustServerCertificate=True
        run: >
          dotnet test VirtualBar.HttpTests/VirtualBar.HttpTests.csproj
          --no-build --configuration Release
          --logger trx
          --collect:"XPlat Code Coverage"
          --results-directory ./test-results

      # Informational for now: the coverage steps never fail the build.
      # Migrations are generated code with no tests of their own, so they are left out of the numbers.
      - name: Coverage report
        id: coverage
        if: always() && hashFiles('test-results/**/coverage.cobertura.xml') != ''
        continue-on-error: true
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version "5.*"
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:"test-results/**/coverage.cobertura.xml" \
            -targetdir:coverage-report \
            -reporttypes:"Html;MarkdownSummaryGithub" \
            -classfilters:"-VirtualBar.Infrastructure.Migrations.*"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # One comment per PR, edited in place on every push. Dependabot PRs and forks get a read-only
      # token, so they skip it; their numbers are still in the job summary.
      - name: Post coverage to the PR
        if: >-
          always() && steps.coverage.outcome == 'success'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- coverage-report -->'
          {
            echo "$marker"
            echo "## Test coverage"
            echo
            echo "_Informational, does not block the PR. Migrations are excluded._"
            echo
            cat coverage-report/SummaryGithub.md
          } > coverage-comment.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@coverage-comment.md > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@coverage-comment.md > /dev/null
          fi

      - name: Upload coverage report
        if: always() && steps.coverage.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 14

      # Fails when an entity changed but nobody added the matching migration.
      # Program.cs refuses to start without a Jwt:Key, so a throwaway one is generated for this step only.
      # No database is contacted; the connection string only has to exist.
      - name: Check for a missing EF Core migration
        env:
          ConnectionStrings__Default: Server=unused;Database=unused
        run: |
          dotnet tool install --global dotnet-ef --version "9.*"
          export PATH="$PATH:$HOME/.dotnet/tools"
          Jwt__Key="$(openssl rand -base64 48)"
          export Jwt__Key
          dotnet ef migrations has-pending-model-changes \
            --project VirtualBar.Infrastructure \
            --startup-project VirtualBar.Api \
            --configuration Release

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # One install for both npm workspaces (VirtualBar.Web and VirtualBar.Web.Tests) from the root lockfile.
      - name: Install
        run: npm ci

      - name: Lint (both workspaces)
        run: npm run lint

      - name: Type check tests
        run: npm run typecheck

      # Vitest + React Testing Library in jsdom: no backend, so it runs on every PR in seconds.
      - name: Unit and component tests
        run: npm test

      - name: Build (type check + Vite)
        run: npm run build
