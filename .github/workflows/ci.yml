name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# A newer push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The test project references every other project, so building it builds the whole backend.
      - name: Restore
        run: dotnet restore VirtualBar.Tests/VirtualBar.Tests.csproj

      - name: Build
        run: dotnet build VirtualBar.Tests/VirtualBar.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test VirtualBar.Tests/VirtualBar.Tests.csproj
          --no-build --configuration Release
          --logger trx
          --collect:"XPlat Code Coverage"
          --results-directory ./test-results

      # Fails when an entity changed but nobody added the matching migration.
      # Program.cs refuses to start without a Jwt:Key, so a throwaway one is generated for this step only.
      # No database is contacted; the connection string only has to exist.
      - name: Check for a missing EF Core migration
        env:
          ConnectionStrings__Default: Server=unused;Database=unused
        run: |
          dotnet tool install --global dotnet-ef --version "9.*"
          export PATH="$PATH:$HOME/.dotnet/tools"
          export Jwt__Key="$(openssl rand -base64 48)"
          dotnet ef migrations has-pending-model-changes \
            --project VirtualBar.Infrastructure \
            --startup-project VirtualBar.Api \
            --configuration Release

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: VirtualBar.Web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VirtualBar.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (type check + Vite)
        run: npm run build
